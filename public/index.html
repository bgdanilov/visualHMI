<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>visualHMI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

        <header>

    <script type="module" src="js/app.js"></script>

</html>
